# Tema del dashboard. Streamlit lee este archivo desde el directorio donde se corre
# `streamlit run`, que es la raíz del repo (local y en Community Cloud).
#
# Baja de precio en azul y suba en rojo, no verde y rojo: ese par se confunde con daltonismo.
# greenColor y redColor son los colores de los deltas de st.metric, así "bajó" se ve igual en los
# KPIs que en los gráficos. El color principal es un índigo neutro, para no pisar ese significado.

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#1F2430"
borderColor = "#E3E5EC"
showWidgetBorder = true
greenColor = "#2A78D6"
redColor = "#E34948"
font = "sans-serif"
chartCategoricalColors = ["#4F46E5", "#2A78D6", "#E34948", "#9CA3AF", "#F59E0B"]

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
