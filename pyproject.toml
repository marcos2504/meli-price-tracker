[project]
name = "meli-price-tracker"
version = "0.1.0"
description = "Pipeline de historial de precios de MercadoLibre"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
# dashboard/ también es código propio: sus módulos se importan sin paquete (data, queries)
src = [".", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
