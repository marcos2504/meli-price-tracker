name: Smoke test API MercadoLibre

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Búsqueda en catálogo"
        default: "iphone 15"
      product:
        description: "ID de producto de catálogo con vendedores"
        default: "MLA1027172677"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Mostrar IP del runner
        run: curl -s https://api.ipify.org && echo

      - name: Correr smoke test
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_QUERY: ${{ inputs.query }}
          ML_PRODUCT: ${{ inputs.product }}
        run: python scripts/smoke_test.py
