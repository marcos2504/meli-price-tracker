name: Smoke test API MercadoLibre

on:
  workflow_dispatch:
    inputs:
      category:
        description: "ID de categoría"
        default: "MLA1055"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Mostrar IP del runner
        run: curl -s https://api.ipify.org && echo

      - name: Correr smoke test
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_CATEGORY: ${{ inputs.category }}
        run: python scripts/smoke_test.py
