version: 2
version: 2

models:
  - name: stg_listing_prices
    description: >
      Precio y condiciones de venta de cada publicación, por producto y día. Si hubo varias
      corridas en el día, se usa la última.
    columns:
      - name: listing_day_id
        description: Clave única (fecha, producto, publicación).
        data_tests: [unique, not_null]
      - name: snapshot_date
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: item_id
        data_tests: [not_null]
      - name: seller_id
        data_tests: [not_null]
      - name: price
        data_tests:
          - not_null
          - positive_value
      - name: currency_id
        data_tests:
          - accepted_values:
              arguments:
                values: ["ARS", "USD"]
      - name: condition
        data_tests:
          - accepted_values:
              arguments:
                values: ["new", "used", "refurbished", "not_specified"]
              config:
                severity: warn

  - name: stg_products
    description: Producto de catálogo con sus atributos principales (marca, línea, modelo, color, memoria).
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]

  - name: scd_listing_prices
    description: >
      Historial SCD tipo 2 de cada publicación: una fila por versión, con su vigencia.
      valid_to es exclusivo y null en la versión vigente.
    columns:
      - name: listing_version_id
        data_tests: [unique, not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: price
        data_tests: [not_null]